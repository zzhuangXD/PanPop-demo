<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100"><title>无盐清鸡汤</title><desc>已完成熬制和澄清、未加盐与酱油的纯清鸡汤，按厨房秤称实际汤质量；不是浓缩鸡汁、浑奶汤或低盐牛肉高汤。</desc><path d="M16 59 Q19 83 60 87 Q101 83 104 59Z" fill="#EFE1C1" stroke="#756044" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="60" cy="57" rx="44" ry="20" fill="#FFFAEC" stroke="#756044" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="60" cy="57" rx="36" ry="15" fill="#E8D9AF" stroke="none"/><path d="M34 55 Q44 50 54 52 M69 62 Q81 64 88 59" fill="none" stroke="#756044" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 75 Q60 86 95 75" fill="none" stroke="#756044" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="96" font-size="8" text-anchor="middle" fill="#756044" font-family="sans-serif">无盐清鸡汤</text></svg>
